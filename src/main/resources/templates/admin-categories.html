<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh mục - POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/common :: navbar}" class="navbar navbar-expand-lg navbar-dark"></nav>

    <div class="container-fluid">
        <div class="row">
            <nav th:replace="~{fragments/common :: sidebar('categories')}" class="col-md-2 d-none d-md-block sidebar"></nav>

            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom">
                    <h1 class="h2"><i class="bi bi-tags me-2"></i>Quản lý Danh mục</h1>
                </div>

                <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                    <i class="bi bi-check-circle me-1"></i><span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="row g-3">
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header"><h6 class="mb-0">Danh sách danh mục</h6></div>
                            <div class="table-responsive">
                                <table class="table table-hover mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>#</th>
                                            <th>Tên danh mục</th>
                                            <th>Hành động</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="cat : ${categories}">
                                            <td th:text="${cat.id}">1</td>
                                            <td th:text="${cat.name}">Cà phê</td>
                                            <td>
                                                <form th:action="@{/admin/categories/{id}/delete(id=${cat.id})}"
                                                      method="post" class="d-inline"
                                                      onsubmit="return confirm('Xóa danh mục này? Sản phẩm trong danh mục có thể bị ảnh hưởng.')">
                                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </form>
                                            </td>
                                        </tr>
                                        <tr th:if="${categories.isEmpty()}">
                                            <td colspan="3" class="text-center text-muted py-4">
                                                <i class="bi bi-inbox fs-4 d-block mb-2"></i>Chưa có danh mục nào
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-header"><h6 class="mb-0">Thêm danh mục mới</h6></div>
                            <div class="card-body">
                                <form th:action="@{/admin/categories/save}" method="post">
                                    <div class="mb-3">
                                        <label for="name" class="form-label fw-semibold">Tên danh mục</label>
                                        <input type="text" class="form-control" id="name" name="name"
                                               placeholder="VD: Cà phê, Nước ép..." required>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100">
                                        <i class="bi bi-plus-lg me-1"></i>Thêm
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/main.js}"></script>
</body>
</html>
