<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.id} ? 'Sửa sản phẩm' : 'Thêm sản phẩm'">Sản phẩm - POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/common :: navbar}" class="navbar navbar-expand-lg navbar-dark"></nav>

    <div class="container-fluid">
        <div class="row">
            <nav th:replace="~{fragments/common :: sidebar('products')}" class="col-md-2 d-none d-md-block sidebar"></nav>

            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom">
                    <h1 class="h2">
                        <i class="bi bi-box me-2"></i>
                        <span th:text="${product.id} ? 'Sửa sản phẩm' : 'Thêm sản phẩm mới'">Sản phẩm</span>
                    </h1>
                    <a th:href="@{/admin/products}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Quay lại
                    </a>
                </div>

                <div class="card shadow-sm" style="max-width: 640px;">
                    <div class="card-body p-4">
                        <form th:action="${product.id} ? @{/admin/products/{id}/update(id=${product.id})} : @{/admin/products/save}"
                              th:object="${product}"
                              method="post">

                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">Tên sản phẩm <span class="text-danger">*</span></label>
                                <input type="text" id="name" th:field="*{name}"
                                       class="form-control" placeholder="Nhập tên sản phẩm" required>
                            </div>

                            <div class="mb-3">
                                <label for="price" class="form-label fw-semibold">Giá (VNĐ) <span class="text-danger">*</span></label>
                                <input type="number" id="price" th:field="*{price}"
                                       class="form-control" placeholder="0" min="0" step="500" required>
                            </div>

                            <div class="mb-3">
                                <label for="category" class="form-label fw-semibold">Danh mục <span class="text-danger">*</span></label>
                                <select id="category" th:field="*{category.id}" class="form-select" required>
                                    <option value="">-- Chọn danh mục --</option>
                                    <option th:each="cat : ${categories}"
                                            th:value="${cat.id}"
                                            th:text="${cat.name}">Danh mục</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label fw-semibold">Mô tả</label>
                                <textarea id="description" th:field="*{description}"
                                          class="form-control" rows="3" placeholder="Mô tả ngắn về sản phẩm"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="imageUrl" class="form-label fw-semibold">URL hình ảnh</label>
                                <input type="text" id="imageUrl" th:field="*{imageUrl}"
                                       class="form-control" placeholder="https://...">
                            </div>

                            <div class="mb-4 form-check">
                                <input type="checkbox" id="isAvailable" th:field="*{isAvailable}"
                                       class="form-check-input">
                                <label for="isAvailable" class="form-check-label">Còn hàng (hiển thị để bán)</label>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save me-1"></i>
                                    <span th:text="${product.id} ? 'Cập nhật' : 'Lưu sản phẩm'">Lưu</span>
                                </button>
                                <a th:href="@{/admin/products}" class="btn btn-outline-secondary">Hủy</a>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/main.js}"></script>
</body>
</html>
