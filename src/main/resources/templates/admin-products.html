<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm - POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/common :: navbar}" class="navbar navbar-expand-lg navbar-dark"></nav>

    <div class="container-fluid">
        <div class="row">
            <nav th:replace="~{fragments/common :: sidebar('products')}" class="col-md-2 d-none d-md-block sidebar"></nav>

            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom">
                    <h1 class="h2"><i class="bi bi-box me-2"></i>Quản lý Sản phẩm</h1>
                    <a th:href="@{/admin/products/new}" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>Thêm sản phẩm
                    </a>
                </div>

                <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                    <i class="bi bi-check-circle me-1"></i><span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Tên sản phẩm</th>
                                    <th>Danh mục</th>
                                    <th>Giá</th>
                                    <th>Trạng thái</th>
                                    <th>Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="product : ${products}">
                                    <td th:text="${product.id}">1</td>
                                    <td th:text="${product.name}">Cà phê</td>
                                    <td th:text="${product.category.name}">Đồ uống</td>
                                    <td th:text="${#numbers.formatCurrency(product.price)}">0</td>
                                    <td>
                                        <span th:if="${product.isAvailable}" class="badge bg-success">Còn hàng</span>
                                        <span th:unless="${product.isAvailable}" class="badge bg-secondary">Tạm hết</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/admin/products/{id}/edit(id=${product.id})}"
                                           class="btn btn-sm btn-outline-primary"
                                           title="Chỉnh sửa">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/admin/products/{id}/toggle(id=${product.id})}"
                                              method="post" class="d-inline"
                                              th:title="${product.isAvailable} ? 'Tắt sản phẩm' : 'Bật sản phẩm'">
                                            <button type="submit" class="btn btn-sm btn-outline-warning">
                                                <i class="bi" th:classappend="${product.isAvailable} ? 'bi-toggle-on' : 'bi-toggle-off'"></i>
                                            </button>
                                        </form>
                                        <form th:action="@{/admin/products/{id}/delete(id=${product.id})}"
                                              method="post" class="d-inline"
                                              onsubmit="return confirm('Xác nhận xóa sản phẩm này?')">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${products.isEmpty()}">
                                    <td colspan="6" class="text-center text-muted py-4">
                                        <i class="bi bi-inbox fs-4 d-block mb-2"></i>Chưa có sản phẩm nào
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/main.js}"></script>
</body>
</html>
