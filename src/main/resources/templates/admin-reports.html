<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo cáo - POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/common :: navbar}" class="navbar navbar-expand-lg navbar-dark"></nav>

    <div class="container-fluid">
        <div class="row">
            <nav th:replace="~{fragments/common :: sidebar('reports')}" class="col-md-2 d-none d-md-block sidebar"></nav>

            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom">
                    <h1 class="h2"><i class="bi bi-bar-chart me-2"></i>Báo cáo Doanh thu</h1>
                    <span class="text-muted small" th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}"></span>
                </div>

                <!-- Stat cards -->
                <div class="row g-3 mb-4">
                    <div class="col-sm-4">
                        <div class="stat-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                            <div class="stat-value" th:text="${#numbers.formatCurrency(todayRevenue)}">0</div>
                            <div class="stat-label"><i class="bi bi-cash-stack me-1"></i>Doanh thu hôm nay</div>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                            <div class="stat-value" th:text="${todayOrders.size()}">0</div>
                            <div class="stat-label"><i class="bi bi-receipt me-1"></i>Hóa đơn hôm nay</div>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <div class="stat-card" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
                            <div class="stat-value" th:text="${totalOrders}">0</div>
                            <div class="stat-label"><i class="bi bi-archive me-1"></i>Tổng hóa đơn</div>
                        </div>
                    </div>
                </div>

                <!-- Today's orders table -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6 class="mb-0"><i class="bi bi-calendar-day me-1"></i>Hóa đơn hôm nay</h6>
                        <span class="badge bg-primary" th:text="${todayOrders.size()} + ' hóa đơn'">0 hóa đơn</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Bàn</th>
                                    <th>Nhân viên</th>
                                    <th>Số tiền</th>
                                    <th>Phương thức</th>
                                    <th>Giờ</th>
                                    <th>Trạng thái</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="order : ${todayOrders}">
                                    <td th:text="${order.id}">1</td>
                                    <td th:text="${order.table.name}">Bàn 1</td>
                                    <td th:text="${order.user.fullName}">Nhân viên</td>
                                    <td th:text="${#numbers.formatCurrency(order.finalAmount)}">0</td>
                                    <td>
                                        <span th:switch="${order.paymentMethod}">
                                            <span th:case="'CASH'">Tiền mặt</span>
                                            <span th:case="'BANK_TRANSFER'">Chuyển khoản</span>
                                            <span th:case="'QR_CODE'">Quét QR</span>
                                            <span th:case="*">—</span>
                                        </span>
                                    </td>
                                    <td th:text="${#temporals.format(order.createdAt, 'HH:mm')}">10:30</td>
                                    <td>
                                        <span th:switch="${order.status}">
                                            <span th:case="'PAID'" class="badge bg-success">Đã thanh toán</span>
                                            <span th:case="'PENDING'" class="badge bg-warning text-dark">Chờ thanh toán</span>
                                            <span th:case="'CANCELLED'" class="badge bg-danger">Đã hủy</span>
                                        </span>
                                    </td>
                                </tr>
                                <tr th:if="${todayOrders.isEmpty()}">
                                    <td colspan="7" class="text-center text-muted py-4">
                                        <i class="bi bi-inbox fs-4 d-block mb-2"></i>Chưa có hóa đơn nào hôm nay
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/main.js}"></script>
</body>
</html>
