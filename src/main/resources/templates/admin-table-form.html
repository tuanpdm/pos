<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${table.id} ? 'Sửa bàn' : 'Thêm bàn'">Bàn - POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/common :: navbar}" class="navbar navbar-expand-lg navbar-dark"></nav>

    <div class="container-fluid">
        <div class="row">
            <nav th:replace="~{fragments/common :: sidebar('tables')}" class="col-md-2 d-none d-md-block sidebar"></nav>

            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom">
                    <h1 class="h2">
                        <i class="bi bi-table me-2"></i>
                        <span th:text="${table.id} ? 'Sửa bàn' : 'Thêm bàn mới'">Bàn</span>
                    </h1>
                    <a th:href="@{/admin/tables}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Quay lại
                    </a>
                </div>

                <div class="card shadow-sm" style="max-width: 480px;">
                    <div class="card-body p-4">
                        <form th:action="${table.id} ? @{/admin/tables/{id}/update(id=${table.id})} : @{/admin/tables/save}"
                              th:object="${table}"
                              method="post">

                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">Tên bàn <span class="text-danger">*</span></label>
                                <input type="text" id="name" th:field="*{name}"
                                       class="form-control" placeholder="VD: Bàn 1, Bàn VIP..." required>
                            </div>

                            <div class="mb-3">
                                <label for="status" class="form-label fw-semibold">Trạng thái</label>
                                <select id="status" th:field="*{status}" class="form-select">
                                    <option value="EMPTY">Trống</option>
                                    <option value="OCCUPIED">Đang phục vụ</option>
                                    <option value="RESERVED">Đã đặt</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="description" class="form-label fw-semibold">Mô tả</label>
                                <input type="text" id="description" th:field="*{description}"
                                       class="form-control" placeholder="VD: Khu vực ngoài trời, tầng 2...">
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save me-1"></i>
                                    <span th:text="${table.id} ? 'Cập nhật' : 'Lưu bàn'">Lưu</span>
                                </button>
                                <a th:href="@{/admin/tables}" class="btn btn-outline-secondary">Hủy</a>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/main.js}"></script>
</body>
</html>
