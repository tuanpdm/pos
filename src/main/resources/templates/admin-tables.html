<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Bàn - POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/common :: navbar}" class="navbar navbar-expand-lg navbar-dark"></nav>

    <div class="container-fluid">
        <div class="row">
            <nav th:replace="~{fragments/common :: sidebar('tables')}" class="col-md-2 d-none d-md-block sidebar"></nav>

            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom">
                    <h1 class="h2"><i class="bi bi-table me-2"></i>Quản lý Bàn</h1>
                    <a th:href="@{/admin/tables/new}" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>Thêm bàn
                    </a>
                </div>

                <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                    <i class="bi bi-check-circle me-1"></i><span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Tên bàn</th>
                                    <th>Mô tả</th>
                                    <th>Trạng thái</th>
                                    <th>Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="table : ${tables}">
                                    <td th:text="${table.id}">1</td>
                                    <td th:text="${table.name}">Bàn 1</td>
                                    <td th:text="${table.description}">—</td>
                                    <td>
                                        <span th:switch="${table.status}">
                                            <span th:case="'EMPTY'" class="badge bg-success">Trống</span>
                                            <span th:case="'OCCUPIED'" class="badge bg-danger">Đang phục vụ</span>
                                            <span th:case="'RESERVED'" class="badge bg-warning text-dark">Đã đặt</span>
                                            <span th:case="*" class="badge bg-secondary" th:text="${table.status}"></span>
                                        </span>
                                    </td>
                                    <td>
                                        <form th:action="@{/admin/tables/{id}/delete(id=${table.id})}"
                                              method="post" class="d-inline"
                                              onsubmit="return confirm('Xóa bàn này?')">
                                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                                    title="Xóa bàn">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${tables.isEmpty()}">
                                    <td colspan="5" class="text-center text-muted py-4">
                                        <i class="bi bi-inbox fs-4 d-block mb-2"></i>Chưa có bàn nào
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/main.js}"></script>
</body>
</html>
