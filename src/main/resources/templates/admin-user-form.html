<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${user.id} ? 'Sửa nhân viên' : 'Thêm nhân viên'">Nhân viên - POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/common :: navbar}" class="navbar navbar-expand-lg navbar-dark"></nav>

    <div class="container-fluid">
        <div class="row">
            <nav th:replace="~{fragments/common :: sidebar('users')}" class="col-md-2 d-none d-md-block sidebar"></nav>

            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom">
                    <h1 class="h2">
                        <i class="bi bi-person me-2"></i>
                        <span th:text="${user.id} ? 'Sửa nhân viên' : 'Thêm nhân viên mới'">Nhân viên</span>
                    </h1>
                    <a th:href="@{/admin/users}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Quay lại
                    </a>
                </div>

                <div class="card shadow-sm" style="max-width: 540px;">
                    <div class="card-body p-4">
                        <form th:action="${user.id} ? @{/admin/users/{id}/update(id=${user.id})} : @{/admin/users/save}"
                              th:object="${user}"
                              method="post">

                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-semibold">Họ và tên</label>
                                <input type="text" id="fullName" th:field="*{fullName}"
                                       class="form-control" placeholder="Nhập họ và tên">
                            </div>

                            <div class="mb-3" th:if="${user.id == null}">
                                <label for="username" class="form-label fw-semibold">Tên đăng nhập <span class="text-danger">*</span></label>
                                <input type="text" id="username" th:field="*{username}"
                                       class="form-control" placeholder="Nhập tên đăng nhập" required>
                            </div>

                            <div class="mb-3" th:if="${user.id == null}">
                                <label for="password" class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" id="password" th:field="*{password}"
                                       class="form-control" placeholder="Nhập mật khẩu" required>
                            </div>

                            <div class="mb-3">
                                <label for="role" class="form-label fw-semibold">Vai trò <span class="text-danger">*</span></label>
                                <select id="role" th:field="*{role.id}" class="form-select" required>
                                    <option value="">-- Chọn vai trò --</option>
                                    <option th:each="r : ${roles}"
                                            th:value="${r.id}"
                                            th:text="${r.name}">Vai trò</option>
                                </select>
                            </div>

                            <div class="mb-4 form-check" th:if="${user.id != null}">
                                <input type="checkbox" id="status" th:field="*{status}"
                                       class="form-check-input">
                                <label for="status" class="form-check-label">Đang hoạt động</label>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save me-1"></i>
                                    <span th:text="${user.id} ? 'Cập nhật' : 'Lưu nhân viên'">Lưu</span>
                                </button>
                                <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Hủy</a>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/main.js}"></script>
</body>
</html>
