<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhân viên - POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/common :: navbar}" class="navbar navbar-expand-lg navbar-dark"></nav>

    <div class="container-fluid">
        <div class="row">
            <nav th:replace="~{fragments/common :: sidebar('users')}" class="col-md-2 d-none d-md-block sidebar"></nav>

            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom">
                    <h1 class="h2"><i class="bi bi-people me-2"></i>Quản lý Nhân viên</h1>
                    <a th:href="@{/admin/users/new}" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>Thêm nhân viên
                    </a>
                </div>

                <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                    <i class="bi bi-check-circle me-1"></i><span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Tên đăng nhập</th>
                                    <th>Họ tên</th>
                                    <th>Vai trò</th>
                                    <th>Trạng thái</th>
                                    <th>Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.id}">1</td>
                                    <td th:text="${user.username}">admin</td>
                                    <td th:text="${user.fullName}">Nguyễn Văn A</td>
                                    <td>
                                        <span th:switch="${user.role.name}">
                                            <span th:case="'ROLE_ADMIN'" class="badge bg-primary">Quản trị viên</span>
                                            <span th:case="'ROLE_CASHIER'" class="badge bg-info text-dark">Thu ngân</span>
                                            <span th:case="*" class="badge bg-secondary" th:text="${user.role.name}"></span>
                                        </span>
                                    </td>
                                    <td>
                                        <span th:if="${user.status}" class="badge bg-success">Hoạt động</span>
                                        <span th:unless="${user.status}" class="badge bg-secondary">Ngừng hoạt động</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/admin/users/{id}/edit(id=${user.id})}"
                                           class="btn btn-sm btn-outline-primary" title="Chỉnh sửa">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/admin/users/{id}/toggle(id=${user.id})}"
                                              method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-outline-warning"
                                                    th:title="${user.status} ? 'Vô hiệu hóa' : 'Kích hoạt'">
                                                <i class="bi" th:classappend="${user.status} ? 'bi-toggle-on' : 'bi-toggle-off'"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${users.isEmpty()}">
                                    <td colspan="6" class="text-center text-muted py-4">
                                        <i class="bi bi-inbox fs-4 d-block mb-2"></i>Chưa có nhân viên nào
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/main.js}"></script>
</body>
</html>
