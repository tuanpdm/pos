<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/common :: navbar}" class="navbar navbar-expand-lg navbar-dark"></nav>

    <div class="container-fluid">
        <div class="row">
            <nav th:replace="~{fragments/common :: sidebar('dashboard')}" class="col-md-2 d-none d-md-block sidebar"></nav>

            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom">
                    <h1 class="h2"><i class="bi bi-speedometer2 me-2"></i>Dashboard</h1>
                    <span class="text-muted small" th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}"></span>
                </div>

                <!-- Stat Cards -->
                <div class="row g-3 mb-4">
                    <div class="col-sm-6 col-xl-3">
                        <div class="stat-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                            <div class="stat-value" th:text="${totalOrders}">0</div>
                            <div class="stat-label"><i class="bi bi-receipt me-1"></i>Tổng Hóa đơn</div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-xl-3">
                        <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                            <div class="stat-value" th:text="${#numbers.formatCurrency(todayRevenue)}">0</div>
                            <div class="stat-label"><i class="bi bi-cash-stack me-1"></i>Doanh thu hôm nay</div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-xl-3">
                        <div class="stat-card" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
                            <div class="stat-value" th:text="${occupiedTables}">0</div>
                            <div class="stat-label"><i class="bi bi-table me-1"></i>Bàn đang phục vụ</div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-xl-3">
                        <div class="stat-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                            <div class="stat-value" th:text="${emptyTables}">0</div>
                            <div class="stat-label"><i class="bi bi-table me-1"></i>Bàn trống</div>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-header">
                                <h5 class="mb-0"><i class="bi bi-cart-check me-1"></i>Bán hàng nhanh</h5>
                            </div>
                            <div class="card-body d-flex flex-column justify-content-center">
                                <a th:href="@{/order}" class="btn btn-primary btn-lg w-100 mb-2">
                                    <i class="bi bi-plus-lg me-1"></i> Chọn bàn & Tạo Hóa đơn
                                </a>
                                <p class="text-muted text-center mb-0 small">Chọn bàn trống để bắt đầu nhận order</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6" sec:authorize="hasRole('ROLE_ADMIN')">
                        <div class="card h-100">
                            <div class="card-header">
                                <h5 class="mb-0"><i class="bi bi-gear me-1"></i>Quản trị</h5>
                            </div>
                            <div class="card-body">
                                <div class="row g-2">
                                    <div class="col-6">
                                        <a th:href="@{/admin/products}" class="btn btn-outline-primary w-100">
                                            <i class="bi bi-box d-block fs-4 mb-1"></i>Sản phẩm
                                        </a>
                                    </div>
                                    <div class="col-6">
                                        <a th:href="@{/admin/users}" class="btn btn-outline-primary w-100">
                                            <i class="bi bi-people d-block fs-4 mb-1"></i>Nhân viên
                                        </a>
                                    </div>
                                    <div class="col-6">
                                        <a th:href="@{/admin/tables}" class="btn btn-outline-primary w-100">
                                            <i class="bi bi-table d-block fs-4 mb-1"></i>Bàn
                                        </a>
                                    </div>
                                    <div class="col-6">
                                        <a th:href="@{/admin/reports}" class="btn btn-outline-primary w-100">
                                            <i class="bi bi-bar-chart d-block fs-4 mb-1"></i>Báo cáo
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6" sec:authorize="!hasRole('ROLE_ADMIN')">
                        <div class="card h-100">
                            <div class="card-header">
                                <h5 class="mb-0"><i class="bi bi-gear me-1"></i>Quản trị</h5>
                            </div>
                            <div class="card-body d-flex align-items-center justify-content-center">
                                <p class="text-muted mb-0"><i class="bi bi-lock me-1"></i>Bạn không có quyền truy cập chức năng quản trị</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/main.js}"></script>
</body>
</html>
