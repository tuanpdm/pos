<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<body>

<!-- ===== NAVBAR ===== -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-shop-window"></i> POS System
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <span class="navbar-text me-3 text-white-50">
                        <i class="bi bi-person-circle me-1"></i><span sec:authentication="name"></span>
                    </span>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/logout}">
                        <i class="bi bi-box-arrow-right"></i> Đăng xuất
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===== SIDEBAR (dùng cho tất cả các trang, active là tên trang hiện tại) ===== -->
<nav th:fragment="sidebar(active)" class="col-md-2 d-none d-md-block bg-white sidebar border-end" style="min-height:100vh;">
    <div class="position-sticky pt-3">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${active == 'dashboard'} ? ' active'" th:href="@{/dashboard}">
                    <i class="bi bi-speedometer2 me-1"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${active == 'order'} ? ' active'" th:href="@{/order}">
                    <i class="bi bi-cart-check me-1"></i> Bán hàng
                </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
                <a class="nav-link" th:classappend="${active == 'products'} ? ' active'" th:href="@{/admin/products}">
                    <i class="bi bi-box me-1"></i> Sản phẩm
                </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
                <a class="nav-link" th:classappend="${active == 'categories'} ? ' active'" th:href="@{/admin/categories}">
                    <i class="bi bi-tags me-1"></i> Danh mục
                </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
                <a class="nav-link" th:classappend="${active == 'tables'} ? ' active'" th:href="@{/admin/tables}">
                    <i class="bi bi-table me-1"></i> Quản lý Bàn
                </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
                <a class="nav-link" th:classappend="${active == 'users'} ? ' active'" th:href="@{/admin/users}">
                    <i class="bi bi-people me-1"></i> Nhân viên
                </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
                <a class="nav-link" th:classappend="${active == 'reports'} ? ' active'" th:href="@{/admin/reports}">
                    <i class="bi bi-bar-chart me-1"></i> Báo cáo
                </a>
            </li>
        </ul>
    </div>
</nav>

</body>
</html>
