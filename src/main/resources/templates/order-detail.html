<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hóa đơn - POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/common :: navbar}" class="navbar navbar-expand-lg navbar-dark"></nav>

    <div class="container-fluid mt-3">
        <div class="row g-4">
            <!-- Left: Product selection -->
            <div class="col-md-8">
                <div class="d-flex align-items-center mb-3 gap-2">
                    <a th:href="@{/order}" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i>
                    </a>
                    <h4 class="mb-0">
                        <i class="bi bi-cart-check me-1"></i>
                        Bàn: <span th:text="${order.table.name}">Bàn 1</span>
                    </h4>
                </div>

                <!-- Category filter -->
                <div class="mb-3">
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-primary btn-sm category-btn active" data-category="all">
                            Tất cả
                        </button>
                        <button type="button"
                                th:each="category : ${categories}"
                                class="btn btn-outline-primary btn-sm category-btn"
                                th:text="${category.name}"
                                th:attr="data-category=${category.id}">
                        </button>
                    </div>
                </div>

                <!-- Product search -->
                <div class="mb-3">
                    <input type="text" id="productSearch" class="form-control" placeholder="Tìm sản phẩm...">
                </div>

                <!-- Product grid -->
                <div class="row g-2" id="productGrid">
                    <div th:each="product : ${products}" class="col-6 col-sm-4 col-lg-3 product-col"
                         th:attr="data-category=${product.category.id}, data-name=${product.name.toLowerCase()}">
                        <div class="product-card h-100">
                            <h6 class="mb-1" th:text="${product.name}">Sản phẩm</h6>
                            <p class="text-muted small mb-2" th:text="${product.description}"></p>
                            <div class="product-price" th:text="${#numbers.formatCurrency(product.price)}">0</div>

                            <div class="mb-2">
                                <select class="form-select form-select-sm" th:id="'size_' + ${product.id}">
                                    <option value="">Kích cỡ</option>
                                    <option value="S">S</option>
                                    <option value="M">M</option>
                                    <option value="L">L</option>
                                </select>
                            </div>
                            <div class="input-group input-group-sm mb-2">
                                <span class="input-group-text">SL</span>
                                <input type="number" th:id="'qty_' + ${product.id}" class="form-control" value="1" min="1" max="99">
                            </div>
                            <button class="btn btn-sm btn-primary w-100"
                                    th:attr="data-product-id=${product.id}, data-product-name=${product.name}, data-product-price=${product.price}"
                                    onclick="openAddItem(this)"
                                    data-bs-toggle="modal" data-bs-target="#noteModal">
                                <i class="bi bi-plus-lg"></i> Thêm
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Current order -->
            <div class="col-md-4">
                <div class="card sticky-top" style="top: 1rem;">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-receipt me-1"></i>Hóa đơn hiện tại</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="order-items" style="max-height: 380px; overflow-y: auto; padding: 1rem;">
                            <div th:if="${details.isEmpty()}" class="text-center text-muted py-4">
                                <i class="bi bi-cart fs-3 d-block mb-2"></i>Chưa có món
                            </div>
                            <div th:each="detail : ${details}" class="order-item">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div class="flex-grow-1 me-2">
                                        <div class="fw-semibold" th:text="${detail.product.name}">Sản phẩm</div>
                                        <small class="text-muted" th:if="${detail.size}" th:text="'Size: ' + ${detail.size}"></small>
                                        <small class="text-muted d-block" th:if="${detail.note}" th:text="'Ghi chú: ' + ${detail.note}"></small>
                                        <small class="text-muted">
                                            x<span th:text="${detail.quantity}">1</span>
                                            × <span th:text="${#numbers.formatCurrency(detail.unitPrice)}">0</span>
                                        </small>
                                    </div>
                                    <div class="text-end">
                                        <div class="fw-bold text-primary small"
                                             th:text="${#numbers.formatCurrency(detail.unitPrice.multiply(detail.quantity))}">0</div>
                                        <form th:action="@{/order/detail/{orderId}/remove-item/{detailId}(orderId=${order.id}, detailId=${detail.id})}"
                                              method="post" class="d-inline"
                                              onsubmit="return confirm('Xóa món này khỏi hóa đơn?')">
                                            <button type="submit" class="btn btn-sm btn-outline-danger mt-1"
                                                    aria-label="Xóa món">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer p-0">
                        <div class="order-summary p-3">
                            <div class="summary-row">
                                <span>Tạm tính:</span>
                                <span th:text="${#numbers.formatCurrency(order.totalAmount)}">0</span>
                            </div>
                            <div class="summary-row" th:if="${order.discountAmount.signum() > 0}">
                                <span>Giảm giá:</span>
                                <span th:text="'-' + ${#numbers.formatCurrency(order.discountAmount)}">0</span>
                            </div>
                            <div class="summary-row" th:if="${order.vatRate.signum() > 0}">
                                <span>VAT (<span th:text="${order.vatRate}">0</span>%):</span>
                                <span th:text="${#numbers.formatCurrency(order.totalAmount.multiply(order.vatRate).divide(100))}">0</span>
                            </div>
                            <div class="summary-row summary-total">
                                <span>Tổng:</span>
                                <span th:text="${#numbers.formatCurrency(order.finalAmount)}">0</span>
                            </div>
                        </div>
                        <div class="p-3 pt-0 d-grid gap-2">
                            <a th:href="@{/order/checkout/{id}(id=${order.id})}"
                               class="btn btn-success btn-lg"
                               th:classappend="${details.isEmpty()} ? ' disabled'">
                                <i class="bi bi-credit-card me-1"></i> Thanh toán
                            </a>
                            <button type="button" class="btn btn-outline-danger btn-sm"
                                    onclick="cancelOrder()">
                                <i class="bi bi-x-circle me-1"></i> Hủy hóa đơn
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Item Modal -->
    <div class="modal fade" id="noteModal" tabindex="-1" aria-labelledby="noteModalLabel">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="noteModalLabel">
                        <i class="bi bi-plus-circle me-1"></i>
                        Thêm: <span id="modalProductName"></span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <form id="addItemForm" th:action="@{/order/detail/{id}/add-item(id=${order.id})}" method="post">
                    <div class="modal-body">
                        <input type="hidden" name="productId" id="modalProductId">
                        <input type="hidden" name="quantity" id="modalQuantity">
                        <input type="hidden" name="size" id="modalSize">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Ghi chú (nếu có):</label>
                            <textarea class="form-control" name="note" id="modalNote" rows="3"
                                      placeholder="Ví dụ: Ít đường, nhiều đá..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-plus-lg me-1"></i>Thêm vào hóa đơn
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/main.js}"></script>
    <script th:inline="javascript">
        const ORDER_URL = /*[[@{/order}]]*/ '/order';

        function openAddItem(btn) {
            const productId = btn.getAttribute('data-product-id');
            document.getElementById('modalProductId').value = productId;
            document.getElementById('modalProductName').textContent = btn.getAttribute('data-product-name');
            document.getElementById('modalQuantity').value = document.getElementById('qty_' + productId).value;
            document.getElementById('modalSize').value = document.getElementById('size_' + productId).value;
            document.getElementById('modalNote').value = '';
        }

        function cancelOrder() {
            if (confirm('Hủy toàn bộ hóa đơn này? Bàn sẽ được trả về trạng thái trống.')) {
                window.location.href = ORDER_URL;
            }
        }

        // Category filter
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.category-btn').forEach(b => {
                    b.classList.remove('active', 'btn-primary');
                    b.classList.add('btn-outline-primary');
                });
                this.classList.add('active', 'btn-primary');
                this.classList.remove('btn-outline-primary');

                const cat = this.getAttribute('data-category');
                filterByCategory(cat);
            });
        });

        function filterByCategory(categoryId) {
            const searchVal = document.getElementById('productSearch').value.toLowerCase();
            document.querySelectorAll('.product-col').forEach(col => {
                const matchCat = categoryId === 'all' || col.getAttribute('data-category') == categoryId;
                const matchSearch = col.getAttribute('data-name').includes(searchVal);
                col.style.display = (matchCat && matchSearch) ? '' : 'none';
            });
        }

        // Search filter
        document.getElementById('productSearch').addEventListener('input', function () {
            const activeCat = document.querySelector('.category-btn.active')?.getAttribute('data-category') || 'all';
            const searchVal = this.value.toLowerCase();
            document.querySelectorAll('.product-col').forEach(col => {
                const matchCat = activeCat === 'all' || col.getAttribute('data-category') == activeCat;
                const matchSearch = col.getAttribute('data-name').includes(searchVal);
                col.style.display = (matchCat && matchSearch) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
