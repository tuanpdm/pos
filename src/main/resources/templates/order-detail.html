<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Detail - POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .product-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(0,0,0,.2);
        }
        .product-card h6 {
            margin-bottom: 10px;
            color: #333;
        }
        .product-price {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        .order-items {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }
        .order-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .order-item-total {
            font-weight: bold;
            color: #667eea;
        }
        .order-summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 20px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,.3);
            padding-bottom: 10px;
        }
        .summary-total {
            font-size: 24px;
            font-weight: bold;
            border: none;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/dashboard}">
                <i class="bi bi-shop"></i> POS System
            </a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/order}">← Quay lại</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/logout}">Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-8">
                <h3 class="mb-4">
                    <i class="bi bi-cart-check"></i> Bàn: <span th:text="${order.table.name}">Bàn 1</span>
                </h3>

                <!-- Categories -->
                <div class="mb-4">
                    <h5>Danh mục:</h5>
                    <div class="btn-group mb-3" role="group">
                        <button type="button" class="btn btn-outline-primary active" onclick="filterProducts('all')">
                            Tất cả
                        </button>
                        <button type="button" th:each="category : ${categories}"
                                class="btn btn-outline-primary"
                                th:text="${category.name}"
                                th:onclick="'filterProducts(' + ${category.id} + ')'">
                        </button>
                    </div>
                </div>

                <!-- Products -->
                <h5>Sản phẩm:</h5>
                <div class="row">
                    <div th:each="product : ${products}" class="col-md-4">
                        <div class="product-card" data-product-id="${product.id}">
                            <h6 th:text="${product.name}">Cà phê</h6>
                            <p class="text-muted small" th:text="${product.description}">Mô tả sản phẩm</p>
                            <div class="product-price" th:text="${#numbers.formatCurrency(product.price)}">
                                0 VND
                            </div>
                            <div class="mb-2">
                                <select class="form-select form-select-sm" th:id="'size_' + ${product.id}">
                                    <option value="">Kích cỡ</option>
                                    <option value="S">S</option>
                                    <option value="M">M</option>
                                    <option value="L">L</option>
                                </select>
                            </div>
                            <div class="input-group input-group-sm mb-2">
                                <span class="input-group-text">Số lượng</span>
                                <input type="number" th:id="'qty_' + ${product.id}" class="form-control" value="1" min="1">
                            </div>
                            <button class="btn btn-sm btn-primary w-100"
                                    th:data-product-id="${product.id}"
                                    th:data-product-name="${product.name}"
                                    th:data-product-price="${product.price}"
                                    onclick="addItem(this.getAttribute('data-product-id'), this.getAttribute('data-product-name'), this.getAttribute('data-product-price'))"
                                    data-bs-toggle="modal" data-bs-target="#noteModal">
                                <i class="bi bi-plus-lg"></i> Thêm
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <h5>Hóa đơn hiện tại:</h5>
                <div class="order-items" style="max-height: 400px; overflow-y: auto;">
                    <div th:if="${details.isEmpty()}" class="text-center text-muted">
                        <p>Chưa có món hàng</p>
                    </div>
                    <div th:each="detail : ${details}" class="order-item">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="mb-1" th:text="${detail.product.name}">Producto</h6>
                                <small th:if="${detail.size}" th:text="'Size: ' + ${detail.size}" class="text-muted"></small>
                                <small th:if="${detail.note}" th:text="'Ghi chú: ' + ${detail.note}" class="d-block text-muted"></small>
                            </div>
                            <div class="text-end">
                                <div class="order-item-total" th:text="${#numbers.formatCurrency(detail.unitPrice.multiply(detail.quantity))}">
                                    0
                                </div>
                                <small th:text="'x' + ${detail.quantity}">x2</small>
                                <br>
                                <form th:action="@{/order/detail/{orderId}/remove-item/{detailId}(orderId=${order.id}, detailId=${detail.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-danger btn-sm mt-2">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="order-summary mt-4">
                    <div class="summary-row">
                        <span>Tạm tính:</span>
                        <span th:text="${#numbers.formatCurrency(order.totalAmount)}">0</span>
                    </div>
                    <div class="summary-row" th:if="${order.discountAmount.signum() > 0}">
                        <span>Giảm giá:</span>
                        <span th:text="'-' + ${#numbers.formatCurrency(order.discountAmount)}">-0</span>
                    </div>
                    <div class="summary-row" th:if="${order.vatRate.signum() > 0}">
                        <span>VAT (<span th:text="${order.vatRate}">0</span>%):</span>
                        <span th:text="${#numbers.formatCurrency(order.totalAmount.multiply(order.vatRate).divide(100))}">0</span>
                    </div>
                    <div class="summary-row summary-total">
                        <span>Tổng:</span>
                        <span th:text="${#numbers.formatCurrency(order.totalAmount)}">0</span>
                    </div>
                </div>

                <div class="mt-3 d-grid gap-2">
                    <a th:href="@{/order/checkout/{id}(id=${order.id})}" class="btn btn-success btn-lg">
                        <i class="bi bi-credit-card"></i> Thanh toán
                    </a>
                    <a th:href="@{/order}" class="btn btn-secondary">Hủy</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Item Modal -->
    <div class="modal fade" id="noteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Thêm ghi chú</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="addItemForm" th:action="@{/order/detail/{id}/add-item(id=${order.id})}" method="post">
                    <div class="modal-body">
                        <input type="hidden" name="productId" id="modalProductId">
                        <input type="hidden" name="quantity" id="modalQuantity">
                        <input type="hidden" name="size" id="modalSize">

                        <div class="mb-3">
                            <label class="form-label">Ghi chú (nếu có):</label>
                            <textarea class="form-control" name="note" id="modalNote" rows="3" placeholder="Ví dụ: Ít đường, nhiều đá..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary">Thêm vào hóa đơn</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function addItem(productId, productName, price) {
            document.getElementById('modalProductId').value = productId;
            document.getElementById('modalQuantity').value = document.getElementById('qty_' + productId).value;
            document.getElementById('modalSize').value = document.getElementById('size_' + productId).value;
        }

        function filterProducts(categoryId) {
            // Implementation for filtering products by category
            console.log('Filter by category: ' + categoryId);
        }
    </script>
</body>
</html>
