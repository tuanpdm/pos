<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Order - POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/dashboard}"><i class="bi bi-shop"></i> POS System</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="bi bi-cart-plus"></i> Tạo Order mới cho bàn: <span th:text="${order.table.name}"></span></h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/order/create}" th:object="${order}" method="post">
                        <!-- Hidden field to map the Table ID back to the Order object -->
                        <input type="hidden" th:field="*{table.id}" />

                        <div class="mb-3">
                            <label for="notes" class="form-label">Ghi chú (Tùy chọn)</label>
                            <textarea class="form-control" id="notes" th:field="*{notes}" rows="3" placeholder="Ghi chú cho order..."></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> Bắt đầu chọn món (Tạo Order)</button>
                            <a th:href="@{/dashboard}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Quay lại</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
