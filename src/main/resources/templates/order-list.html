<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bán hàng - POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/common :: navbar}" class="navbar navbar-expand-lg navbar-dark"></nav>

    <div class="container-fluid">
        <div class="row">
            <nav th:replace="~{fragments/common :: sidebar('order')}" class="col-md-2 d-none d-md-block sidebar"></nav>

            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom">
                    <h1 class="h2"><i class="bi bi-cart-check me-2"></i>Quản lý Bán hàng</h1>
                </div>

                <!-- Table Grid -->
                <h5 class="mb-3 text-muted">Chọn bàn để bắt đầu:</h5>
                <div class="row g-3 mb-5">
                    <div th:each="table : ${tables}" class="col-6 col-sm-4 col-md-3 col-lg-2">
                        <div class="table-card h-100" th:classappend="${table.status == 'EMPTY'} ? ' empty' : ' occupied'">
                            <div class="fw-bold mb-1" th:text="${table.name}">Bàn 1</div>
                            <small class="text-muted d-block mb-2" th:text="${table.description}"></small>

                            <span class="status-badge mb-3 d-inline-block"
                                  th:classappend="${table.status == 'EMPTY'} ? ' status-empty' : (${table.status == 'OCCUPIED'} ? ' status-occupied' : ' status-reserved')">
                                <span th:switch="${table.status}">
                                    <span th:case="'EMPTY'">Trống</span>
                                    <span th:case="'OCCUPIED'">Đang phục vụ</span>
                                    <span th:case="'RESERVED'">Đã đặt</span>
                                </span>
                            </span>

                            <!-- Empty table: POST form to create order directly (no intermediate screen) -->
                            <form th:if="${table.status == 'EMPTY'}"
                                  th:action="@{/order/quick-create/{id}(id=${table.id})}"
                                  method="post" class="mt-auto">
                                <button type="submit" class="btn btn-success btn-sm w-100">
                                    <i class="bi bi-plus-lg"></i> Tạo Hóa đơn
                                </button>
                            </form>

                            <!-- Occupied table: go to active order -->
                            <a th:if="${table.status == 'OCCUPIED'}"
                               th:href="@{/order/active/{id}(id=${table.id})}"
                               class="btn btn-warning btn-sm w-100 mt-auto">
                                <i class="bi bi-pencil"></i> Tiếp tục
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Recent Orders -->
                <h5 class="mb-3 text-muted">Hóa đơn gần đây:</h5>
                <div class="card">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Bàn</th>
                                    <th>Nhân viên</th>
                                    <th>Số tiền</th>
                                    <th>Trạng thái</th>
                                    <th>Thời gian</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="order : ${orders}">
                                    <td th:text="${order.id}">1</td>
                                    <td th:text="${order.table.name}">Bàn 1</td>
                                    <td th:text="${order.user.fullName}">Nhân viên</td>
                                    <td th:text="${#numbers.formatCurrency(order.totalAmount)}">0</td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${order.status == 'PAID'} ? 'bg-success' : (${order.status == 'PENDING'} ? 'bg-warning text-dark' : 'bg-danger')">
                                            <span th:switch="${order.status}">
                                                <span th:case="'PAID'">Đã thanh toán</span>
                                                <span th:case="'PENDING'">Chờ thanh toán</span>
                                                <span th:case="'CANCELLED'">Đã hủy</span>
                                            </span>
                                        </span>
                                    </td>
                                    <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">—</td>
                                    <td>
                                        <a th:href="@{/order/detail/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${orders.isEmpty()}">
                                    <td colspan="7" class="text-center text-muted py-4">
                                        <i class="bi bi-inbox fs-4 d-block mb-2"></i>Chưa có hóa đơn nào
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/main.js}"></script>
</body>
</html>
