<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .table-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
            min-width: 150px;
        }
        .table-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 12px rgba(0,0,0,.2);
        }
        .table-card.empty {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
        }
        .table-card.occupied {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 10px;
        }
        .status-empty {
            background-color: #d4edda;
            color: #155724;
        }
        .status-occupied {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/dashboard}">
                <i class="bi bi-shop"></i> POS System
            </a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <span class="navbar-text me-3">Welcome, <span sec:authentication="name"></span></span>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/logout}">Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="mb-4">
            <h2>
                <i class="bi bi-cart-check"></i> Quản lý Bán hàng
            </h2>
            <p class="text-muted">Chọn bàn để bắt đầu tạo hóa đơn</p>
        </div>

        <div class="row">
            <div class="col-12">
                <h5 class="mb-3">Danh sách bàn:</h5>
                <div class="d-flex flex-wrap">
                    <div th:each="table : ${tables}"
                         class="table-card"
                         th:classappend="${table.status == 'EMPTY'} ? 'empty' : 'occupied'"
                         data-bs-toggle="tooltip"
                         th:title="${table.status}">
                        <h6 th:text="${table.name}">Bàn 1</h6>
                        <small class="text-muted" th:text="${table.description}">Bàn phục vụ</small>
                        <div class="status-badge" th:classappend="'status-' + ${table.status.toLowerCase()}">
                            <span th:if="${table.status == 'EMPTY'}">Trống</span>
                            <span th:if="${table.status == 'OCCUPIED'}">Đang phục vụ</span>
                            <span th:if="${table.status == 'RESERVED'}">Đã đặt</span>
                        </div>

                        <div class="mt-3">
                            <a th:href="@{/order/new/{id}(id=${table.id})}"
                               class="btn btn-sm btn-primary w-100"
                               th:if="${table.status == 'EMPTY'}">
                                <i class="bi bi-plus"></i> Tạo Hóa đơn
                            </a>
                            <a th:href="@{/order/active/{id}(id=${table.id})}"
                               class="btn btn-sm btn-warning w-100"
                               th:if="${table.status == 'OCCUPIED'}">
                                <i class="bi bi-pencil"></i> Tiếp tục
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-5">
            <div class="col-12">
                <h5 class="mb-3">Hóa đơn gần đây:</h5>
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Hóa đơn #</th>
                            <th>Bàn</th>
                            <th>Nhân viên</th>
                            <th>Số tiền</th>
                            <th>Trạng thái</th>
                            <th>Thời gian</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td th:text="${order.id}">1</td>
                            <td th:text="${order.table.name}">Bàn 1</td>
                            <td th:text="${order.user.fullName}">John Doe</td>
                            <td th:text="${#numbers.formatCurrency(order.totalAmount)}">0</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${order.status == 'PAID'} ? 'bg-success' : (${order.status == 'PENDING'} ? 'bg-warning' : 'bg-danger')"
                                      th:text="${order.status}">PENDING</span>
                            </td>
                            <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">12/03/2025</td>
                            <td>
                                <a th:href="@{/order/detail/{id}(id=${order.id})}" class="btn btn-sm btn-info">
                                    <i class="bi bi-eye"></i> Xem
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
          return new bootstrap.Tooltip(tooltipTriggerEl)
        })
    </script>
</body>
</html>
